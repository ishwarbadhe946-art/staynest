# Local full stack with a real MongoDB:  docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/staynestDB
      JWT_SECRET: local-dev-secret
    depends_on: [mongo]
volumes:
  mongo-data:
